[project]
name = "control-ofc-gui"
version = "2.40.0"
description = "Desktop fan control GUI for the Control-OFC daemon"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "PySide6>=6.6,<7",
    "httpx>=0.27,<1",
    "pyqtgraph>=0.14,<1",
    # numpy 2.0 was a breaking API change; the real floor is >=2.0 (not 1.26).
    "numpy>=2.0,<3",
    # colorama is a load-bearing pyqtgraph load-time transitive — pyqtgraph
    # imports it unconditionally at module load but its metadata omits the dep,
    # so we declare it explicitly. Do not remove (DEC-103).
    "colorama>=0.4,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.3",
    "pytest-timeout>=2.3",
    # Coverage plugin for the `pytest --cov` audit/test-tests/release gate
    # (CLAUDE.md "Quality gates"). Without it that gate errors out on `--cov`.
    "pytest-cov>=5",
    "ruff>=0.4",
    "pip-audit>=2.7",
    # Dead-code sweep for the /ofc:audit pass. Was installed ad hoc into .venv
    # and declared nowhere, which meant it rode along in the
    # `pip freeze --exclude-editable` snapshot DEC-143 defines as the canonical
    # audit input — so a "clean" supply-chain result had scanned a package that
    # was not part of the reproducible surface (DEC-258).
    "vulture>=2.14",
    # 3.x reads scope from [tool.mutmut]; the old 2.5 `--paths-to-mutate` CLI is gone.
    "mutmut>=3.5",
    # tests/test_packaging_dependencies.py parses .github/workflows/release.yml to
    # guard the release-asset wiring. Declared explicitly rather than leaned on as
    # a transitive of pip-audit/mutmut — that is precisely the DEC-103 mistake.
    "pyyaml>=6",
]

[project.scripts]
control-ofc-gui = "control_ofc.main:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Backstop against a wedged test (e.g. an unpatched modal dialog blocking on
# exec()). The autouse `_neutralize_modals` fixture in tests/conftest.py is the
# real guard; this is a last-resort cap. `thread` method is required — a
# blocked native Qt event loop won't honour SIGALRM (the `signal` method).
# Configured as ini options (not addopts) so a run without pytest-timeout
# installed degrades to a warning rather than failing to start.
timeout = 60
timeout_method = "thread"

# Mutation scope (run via /test-tests). After the 2.0.0 control-migration the
# GUI no longer evaluates curves or writes PWM (control_loop.py is deleted); the
# remaining author-side safety logic lives in profile_service.py — the schema
# migration ladder, the role-floor bake (DEC-095/162), and the demo/preview
# interpolate(). That is the meaningful Python mutation target now. (The daemon's
# runtime safety logic — profile.rs::validate, override expiry/fencing, the
# role-floor backstop — is Rust; mutate it with cargo-mutants, not mutmut.)
[tool.mutmut]
# mutmut 3.6 renamed these keys (paths_to_mutate -> source_paths,
# tests_dir -> pytest_add_cli_args_test_selection); same list format.
source_paths = ["src/control_ofc/services/profile_service.py"]
pytest_add_cli_args_test_selection = [
    "tests/test_profile_service.py",
    "tests/test_profile_service_daemon.py",
    "tests/test_role_classification_parity.py",
    "tests/test_aio_phase1.py",
    "tests/test_aio_phase2.py",
]

[tool.coverage.run]
branch = true
source = ["control_ofc"]

[tool.coverage.report]
# Branch-coverage floor for the audit/test-tests/release `pytest --cov` gate and
# the push/PR CI workflow (.github/workflows/ci.yml). Measured 84% on 2026-06-21;
# the floor sits below that to leave refactor headroom — ratchet it upward over
# time rather than letting coverage silently regress.
# DEC-258: raised 80 -> 88. Actual coverage has sat at ~89% for many releases,
# so an 80 floor could absorb a nine-point regression without failing. 88 leaves
# roughly a point of headroom for legitimate churn while making a real drop loud.
fail_under = 88
show_missing = true

[tool.setuptools.package-data]
# Ship bundled theme presets + OFL fonts inside the wheel so first-run install
# can copy the presets into the user's themes_dir and register_bundled_fonts()
# can load the fonts at startup (DEC-208).
"control_ofc" = ["ui/presets/*.json", "ui/fonts/*.ttf", "ui/fonts/*.txt"]

[build-system]
# DEC-258: 77.0.0, not 68.0. `license = "MIT"` above is PEP 639's bare SPDX
# expression, and setuptools only learned to read that shape in 77.0.0 —
# 68.0-76.x parse `project.license` as PEP 621's table and mis-handle a plain
# string. Wrong since the first commit, and invisible because both real build
# paths dodge it: pip's isolated build resolves the newest satisfying setuptools,
# and the PKGBUILD builds `--no-isolation` against Arch's current one. It bites
# anyone testing minimum-supported versions or building from a pinned mirror.
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"
